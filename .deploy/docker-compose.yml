volumes:
  synaptiquiz_postgres:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data

  synaptiquiz_sqlite:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: .

networks:
  synaptiquiz_network:
    driver: bridge