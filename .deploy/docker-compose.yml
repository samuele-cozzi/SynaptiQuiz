services:
  webapp:
    image: samuelecozzi/synaptiquiz:latest
    container_name: synaptiquiz_sqlite
    restart: unless-stopped
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-secret-change-before-deploying}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - synaptiquiz_sqlite:/data
    networks:
      - synaptiquiz_network

