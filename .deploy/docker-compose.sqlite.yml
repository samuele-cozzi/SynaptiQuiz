services:
  webapp:
    image: samuelecozzi/synaptiquiz:latest-sqlite
    container_name: synaptiquiz_sqlite
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: ${DATABASE_URL:-file:/data/synaptiquiz.db}
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-secret-change-before-deploying}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password01}
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - synaptiquiz_sqlite:/data
    networks:
      - synaptiquiz_network

volumes:
  synaptiquiz_sqlite:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: .

network:
  default:
    name: synaptiquiz_network
    driver: bridge