name: Test and publish Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      SESSION_SECRET: ci-test-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database_provider: [sqlite, postgresql]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/synaptiquiz', secrets.DOCKERHUB_USERNAME) || 'local/synaptiquiz' }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.database_provider }}
            type=ref,event=tag,suffix=-${{ matrix.database_provider }}
            type=sha,prefix=sha-,suffix=-${{ matrix.database_provider }}
            type=raw,value=latest-${{ matrix.database_provider }},enable={{is_default_branch}}
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: DATABASE_PROVIDER=${{ matrix.database_provider }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Skip publish when Docker Hub secrets are missing
        if: ${{ secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '' }}
        run: echo "Docker Hub publish skipped; configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets."