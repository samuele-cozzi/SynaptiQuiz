services:
  postgres:
    image: postgres:18-alpine
    container_name: synaptiquiz_db
    profiles: ["postgresql"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-synaptiquiz}
    ports:
      - "5432:5432"
    # volumes:
    #   - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: samuelecozzi/synaptiquiz:latest
    container_name: synaptiquiz_app
    volumes:
      - ./sqlite-data:/app/sqlite-data
    # env_file: ./.env
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-file:./sqlite-data/synaptiquiz.db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
